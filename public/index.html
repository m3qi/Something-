<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>تحدي الألغاز - 10 مراحل</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🧩 لعبة الألغاز</h1>
        <div id="stage-container">
            <div id="puzzle-box">
                <h2 id="stage-title">المرحلة 1</h2>
                <p id="puzzle-text">السؤال: ...</p>
                <div id="hint-box">
                    <span class="hint-label">💡 تلميح:</span>
                    <span id="hint-text"></span>
                </div>
                <div id="music-player" style="margin: 15px 0;"></div>
                <input type="text" id="answer-input" placeholder="أدخل إجابتك هنا">
                <button id="submit-btn">تحقق</button>
                <p id="message"></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
