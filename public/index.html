<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>?a dream - تحدي الألغاز</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="strawberry-bg"></div>
    
    <div class="container">
        <div class="strawberry-emoji">🍓</div>
        <h1 class="game-title">✨ a dream? ✨</h1>
        <p class="subtitle">عشر مراحل | تحدٍ يومي</p>
        
        <div class="navigation-buttons">
            <button id="prev-stage-btn" class="nav-btn" disabled>⭠ المرحلة السابقة</button>
            <span id="stage-indicator">المرحلة <span id="stage-number">1</span> / 10</span>
            <button id="next-stage-btn" class="nav-btn" disabled>المرحلة التالية ⭢</button>
        </div>
        
        <div id="countdown-container" style="display: none;">
            <div class="countdown-box">
                <span class="countdown-label">⏰ المرحلة القادمة تفتح بعد:</span>
                <span id="countdown-timer">00:00:00</span>
            </div>
        </div>
        
        <div id="stage-container">
            <div id="puzzle-box">
                <h2 id="stage-title">المرحلة 1</h2>
                <div class="question-card">
                    <p id="puzzle-text">📖 السؤال: ...</p>
                </div>
                <div id="hint-box">
                    <span class="hint-label">💡 تلميح:</span>
                    <span id="hint-text"></span>
                </div>
                <div id="music-player" style="margin: 15px 0;"></div>
                <div class="answer-section">
                    <input type="text" id="answer-input" placeholder="اكتب إجابتك هنا...">
                    <button id="submit-btn">🚀 تحقق</button>
                </div>
                <div id="progress-bar-container">
                    <div id="progress-bar"></div>
                </div>
                <p id="message"></p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
